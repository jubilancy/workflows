name: daily-trivia

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  schedule:
    - cron: "0 19 * * *" # new question daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive slug from this workflow's own filename
        id: slug
        run: |
          ref="${{ github.workflow_ref }}"
          nover="${ref%@*}"
          slug="$(basename "$nover" .yml)"
          slug="$(basename "$slug" .yaml)"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Fetch a trivia question
        id: trivia
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import html
          import json
          import urllib.request

          with urllib.request.urlopen("https://opentdb.com/api.php?amount=1") as r:
              data = json.load(r)

          q = data["results"][0]
          question = html.unescape(q["question"])
          answer = html.unescape(q["correct_answer"])

          print("question<<EOF")
          print(question)
          print("EOF")
          print("answer<<EOF")
          print(answer)
          print("EOF")
          PY

      - name: Render trivia as SVG card
        run: |
          mkdir -p "workflows/${{ steps.slug.outputs.slug }}"
          python3 - <<'PY'
          import html
          import textwrap

          question = """${{ steps.trivia.outputs.question }}""".strip() or "(no question today)"
          answer = """${{ steps.trivia.outputs.answer }}""".strip()
          wrapped = textwrap.wrap(question, width=44) or ["(no question today)"]

          line_height = 26
          width = 560
          height = len(wrapped) * line_height + 130

          q_lines = "".join(
              f'<text x="40" y="{55 + i * line_height}" font-family="Georgia, serif" '
              f'font-size="19" fill="#2b2b3d">{html.escape(l)}</text>'
              for i, l in enumerate(wrapped)
          )
          answer_y = 55 + len(wrapped) * line_height + 30

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{height}">
          <rect width="100%" height="100%" fill="#f4eefc" stroke="#d9c4f2" stroke-width="2"/>
          <text x="40" y="34" font-family="monospace" font-size="14" fill="#7c4fb0">🧠 Trivia of the Day</text>
          {q_lines}
          <text x="40" y="{answer_y}" font-family="monospace" font-size="15" fill="#7c4fb0">Answer: {html.escape(answer)}</text>
          </svg>'''

          slug = "${{ steps.slug.outputs.slug }}"
          with open(f"workflows/{slug}/output.svg", "w") as f:
              f.write(svg)
          PY

      - name: Commit output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "workflows/${{ steps.slug.outputs.slug }}/output.svg"
          if git diff --quiet --cached; then
            echo "No changes to commit."
          else
            git commit -m "Update ${{ steps.slug.outputs.slug }} output"
            git fetch origin main
            git rebase origin/main
            git push
          fi
