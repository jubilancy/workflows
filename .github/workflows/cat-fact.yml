name: cat-fact

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  schedule:
    - cron: "0 14 * * *" # new fact daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive slug from this workflow's own filename
        id: slug
        run: |
          ref="${{ github.workflow_ref }}"
          nover="${ref%@*}"
          slug="$(basename "$nover" .yml)"
          slug="$(basename "$slug" .yaml)"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Fetch a cat fact
        id: fact
        run: |
          fact="$(curl -s https://catfact.ninja/fact | python3 -c 'import json,sys; print(json.load(sys.stdin)["fact"])')"
          echo "fact<<EOF" >> "$GITHUB_OUTPUT"
          echo "$fact" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Render fact as SVG card
        run: |
          mkdir -p "workflows/${{ steps.slug.outputs.slug }}"
          python3 - <<'PY'
          import html
          import textwrap
          import os

          fact = """${{ steps.fact.outputs.fact }}""".strip() or "(no fact today)"
          wrapped = textwrap.wrap(fact, width=46) or ["(no fact today)"]

          line_height = 26
          width = 560
          height = len(wrapped) * line_height + 80

          text_lines = "".join(
              f'<text x="40" y="{50 + i * line_height}" font-family="Georgia, serif" '
              f'font-size="19" fill="#2e2e3a">{html.escape(l)}</text>'
              for i, l in enumerate(wrapped)
          )

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{height}">
          <rect width="100%" height="100%" fill="#eef3ff" stroke="#c9d6f7" stroke-width="2"/>
          <text x="40" y="34" font-family="monospace" font-size="14" fill="#5b6fa8">🐱 Cat Fact of the Day</text>
          {text_lines}
          </svg>'''

          slug = "${{ steps.slug.outputs.slug }}"
          with open(f"workflows/{slug}/output.svg", "w") as f:
              f.write(svg)
          PY

      - name: Commit output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "workflows/${{ steps.slug.outputs.slug }}/output.svg"
          if git diff --quiet --cached; then
            echo "No changes to commit."
          else
            git commit -m "Update ${{ steps.slug.outputs.slug }} output"
            git fetch origin main
            git rebase origin/main
            git push
          fi
