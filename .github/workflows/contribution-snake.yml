name: contribution-snake

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/contribution-snake.yml"
  schedule:
    - cron: "0 6 * * *" # daily, since it reflects your latest contributions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake animation
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            workflows/contribution-snake/output.gif
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add workflows/contribution-snake/output.gif
          git diff --quiet --cached || git commit -m "Update contribution-snake output"
          git pull --rebase origin main
          git push
