name: advice-slip
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  schedule:
    - cron: "0 15 * * *" # new advice daily
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Derive slug from this workflow's own filename
        id: slug
        run: |
          ref="${{ github.workflow_ref }}"
          nover="${ref%@*}"
          slug="$(basename "$nover" .yml)"
          slug="$(basename "$slug" .yaml)"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
      - name: Fetch a random advice slip
        id: advice
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import time
          import urllib.request

          url = "https://api.adviceslip.com/advice"
          advice = None
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(url, timeout=10) as r:
                      data = json.load(r)
                      advice = data["slip"]["advice"]
                  break
              except Exception as e:
                  print(f"Attempt {attempt+1} failed: {e}")
                  time.sleep(3)

          if not advice:
              advice = "(no advice today)"

          print("advice<<EOF")
          print(advice)
          print("EOF")
          PY
      - name: Render advice as SVG card
        run: |
          mkdir -p "workflows/${{ steps.slug.outputs.slug }}"
          python3 - <<'PY'
          import html
          import textwrap
          advice = """${{ steps.advice.outputs.advice }}""".strip() or "(no advice today)"
          wrapped = textwrap.wrap(advice, width=44) or ["(no advice today)"]
          line_height = 28
          width = 560
          height = len(wrapped) * line_height + 90
          text_lines = "".join(
              f'<text x="40" y="{55 + i * line_height}" font-family="Georgia, serif" '
              f'font-style="italic" font-size="20" fill="#243b2f">{html.escape(l)}</text>'
              for i, l in enumerate(wrapped)
          )
          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{height}">
          <rect width="100%" height="100%" fill="#eefaf0" stroke="#bfe8c9" stroke-width="2"/>
          <text x="40" y="34" font-family="monospace" font-size="14" fill="#3f8a56">Random Advice</text>
          {text_lines}
          </svg>'''
          slug = "${{ steps.slug.outputs.slug }}"
          with open(f"workflows/{slug}/output.svg", "w") as f:
              f.write(svg)
          PY
      - name: Commit output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "workflows/${{ steps.slug.outputs.slug }}/output.svg"
          if git diff --quiet --cached; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update ${{ steps.slug.outputs.slug }} output"
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push && exit 0
            echo "Push attempt $i failed, retrying..."
            git rebase --abort 2>/dev/null || true
            sleep $((RANDOM % 10 + 1))
            git rebase origin/main
          done
          echo "All push attempts failed."
          exit 1
