name: random-dog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  schedule:
    - cron: "0 18 * * *" # new dog daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive slug from this workflow's own filename
        id: slug
        run: |
          ref="${{ github.workflow_ref }}"
          nover="${ref%@*}"
          slug="$(basename "$nover" .yml)"
          slug="$(basename "$slug" .yaml)"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Fetch a random dog photo URL
        id: dog
        run: |
          url="$(curl -s https://dog.ceo/api/breeds/image/random | python3 -c 'import json,sys; print(json.load(sys.stdin)["message"])')"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Download the photo
        run: |
          mkdir -p "workflows/${{ steps.slug.outputs.slug }}"
          curl -sL "${{ steps.dog.outputs.url }}" -o "workflows/${{ steps.slug.outputs.slug }}/output.jpg"

      - name: Commit output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "workflows/${{ steps.slug.outputs.slug }}/output.jpg"
          if git diff --quiet --cached; then
            echo "No changes to commit."
          else
            git commit -m "Update ${{ steps.slug.outputs.slug }} output"
            git fetch origin main
            git rebase origin/main
            git push
          fi
