name: bubble-wrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  schedule:
    - cron: "0 20 * * *" # fresh pattern daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive slug from this workflow's own filename
        id: slug
        run: |
          ref="${{ github.workflow_ref }}"
          nover="${ref%@*}"
          slug="$(basename "$nover" .yml)"
          slug="$(basename "$slug" .yaml)"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Generate bubble wrap SVG
        run: |
          mkdir -p "workflows/${{ steps.slug.outputs.slug }}"
          python3 - <<'PY'
          import random

          cols, rows = 12, 8
          cell = 40
          width, height = cols * cell, rows * cell

          circles = []
          for row in range(rows):
              for col in range(cols):
                  cx = col * cell + cell / 2
                  cy = row * cell + cell / 2
                  popped = random.random() < 0.35
                  fill = "#dbe7f5" if popped else "#a9c9ec"
                  stroke = "#8fb3da" if popped else "#6f9bd1"
                  r = cell * 0.38 if not popped else cell * 0.3
                  circles.append(
                      f'<circle cx="{cx}" cy="{cy}" r="{r}" fill="{fill}" stroke="{stroke}" stroke-width="2"/>'
                  )

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{width}" height="{height}">
          <rect width="100%" height="100%" fill="#f2f6fb"/>
          {"".join(circles)}
          </svg>'''

          slug = "${{ steps.slug.outputs.slug }}"
          with open(f"workflows/{slug}/output.svg", "w") as f:
              f.write(svg)
          PY

      - name: Commit output
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add "workflows/${{ steps.slug.outputs.slug }}/output.svg"
          if git diff --quiet --cached; then
            echo "No changes to commit."
          else
            git commit -m "Update ${{ steps.slug.outputs.slug }} output"
            git fetch origin main
            git rebase origin/main
            git push
          fi
