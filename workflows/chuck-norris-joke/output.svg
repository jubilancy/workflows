<svg xmlns="http://www.w3.org/2000/svg" width="580" height="230">
<rect width="100%" height="100%" fill="#fff0ee" stroke="#f3c6be" stroke-width="2"/>
<text x="40" y="34" font-family="monospace" font-size="14" fill="#b5432f">🥋 Chuck Norris Fact</text>
<text x="40" y="55" font-family="Georgia, serif" font-size="20" fill="#3a1e1e">Chuck Norris was recently inducted to the</text><text x="40" y="83" font-family="Georgia, serif" font-size="20" fill="#3a1e1e">Rock &amp; Roll Hall of Fame for his superlative</text><text x="40" y="111" font-family="Georgia, serif" font-size="20" fill="#3a1e1e">rendition of the Iron Butterly hit song,</text><text x="40" y="139" font-family="Georgia, serif" font-size="20" fill="#3a1e1e">&quot;In-A-Gadda-Da-Vida&quot; which he sang while</text><text x="40" y="167" font-family="Georgia, serif" font-size="20" fill="#3a1e1e">playing his hand made dulcimer.</text>
</svg>