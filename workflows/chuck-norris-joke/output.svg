<text x="40" y="55" font-family="Georgia, serif" font-size="20" fill="#3a1e1e">A cab driver in Paris received a near fatal</text><text x="40" y="83" font-family="Georgia, serif" font-size="20" fill="#3a1e1e">roundhouse to his face from Chuck Norris. It</text><text x="40" y="111" font-family="Georgia, serif" font-size="20" fill="#3a1e1e">was Chuck Norris&#x27; way of saying Hi in</text><text x="40" y="139" font-family="Georgia, serif" font-size="20" fill="#3a1e1e">French.</text>
</svg>