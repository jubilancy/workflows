<svg xmlns="http://www.w3.org/2000/svg" width="560" height="210">
<rect width="100%" height="100%" fill="#eef3ff" stroke="#c9d6f7" stroke-width="2"/>
<text x="40" y="34" font-family="monospace" font-size="14" fill="#5b6fa8">🐱 Cat Fact of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">Cats hate the water because their fur does not</text><text x="40" y="76" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">insulate well when it’s wet. The Turkish Van,</text><text x="40" y="102" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">however, is one cat that likes swimming. Bred</text><text x="40" y="128" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">in central Asia, its coat has a unique texture</text><text x="40" y="154" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">that makes it water resistant.</text>
</svg>