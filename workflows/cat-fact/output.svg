<svg xmlns="http://www.w3.org/2000/svg" width="560" height="236">
<rect width="100%" height="100%" fill="#eef3ff" stroke="#c9d6f7" stroke-width="2"/>
<text x="40" y="34" font-family="monospace" font-size="14" fill="#5b6fa8">🐱 Cat Fact of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">The largest domestic cat breed is called</text><text x="40" y="76" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">Ragdoll with males weighing in at 1 5 to 20</text><text x="40" y="102" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">lbs. The heaviest domestic cat on record was a</text><text x="40" y="128" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">neutered male tabby named Himmy from</text><text x="40" y="154" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">Queensland, Australia who weighed 46 lbs. 1 5</text><text x="40" y="180" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">oz.</text>
</svg>