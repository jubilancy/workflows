<svg xmlns="http://www.w3.org/2000/svg" width="560" height="158">
<rect width="100%" height="100%" fill="#eef3ff" stroke="#c9d6f7" stroke-width="2"/>
<text x="40" y="34" font-family="monospace" font-size="14" fill="#5b6fa8">🐱 Cat Fact of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">Miacis, the primitive ancestor of cats, was a</text><text x="40" y="76" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">small, tree-living creature of the late Eocene</text><text x="40" y="102" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">period, some 45 to 50 million years ago.</text>
</svg>