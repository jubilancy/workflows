<svg xmlns="http://www.w3.org/2000/svg" width="560" height="236">
<rect width="100%" height="100%" fill="#eef3ff" stroke="#c9d6f7" stroke-width="2"/>
<text x="40" y="34" font-family="monospace" font-size="14" fill="#5b6fa8">🐱 Cat Fact of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">The smallest pedigreed cat is a Singapura,</text><text x="40" y="76" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">which can weigh just 4 lbs (1.8 kg), or about</text><text x="40" y="102" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">five large cans of cat food. The largest</text><text x="40" y="128" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">pedigreed cats are Maine Coon cats, which can</text><text x="40" y="154" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">weigh 25 lbs (11.3 kg), or nearly twice as</text><text x="40" y="180" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">much as an average cat weighs.</text>
</svg>