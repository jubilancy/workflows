<svg xmlns="http://www.w3.org/2000/svg" width="560" height="184">
<rect width="100%" height="100%" fill="#eef3ff" stroke="#c9d6f7" stroke-width="2"/>
<text x="40" y="34" font-family="monospace" font-size="14" fill="#5b6fa8">🐱 Cat Fact of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">Most cats give birth to a litter of between</text><text x="40" y="76" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">one and nine kittens. The largest known litter</text><text x="40" y="102" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">ever produced was 19 kittens, of which 15</text><text x="40" y="128" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">survived.</text>
</svg>