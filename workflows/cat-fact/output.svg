<svg xmlns="http://www.w3.org/2000/svg" width="560" height="184">
<rect width="100%" height="100%" fill="#eef3ff" stroke="#c9d6f7" stroke-width="2"/>
<text x="40" y="34" font-family="monospace" font-size="14" fill="#5b6fa8">🐱 Cat Fact of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">The cat&#x27;s front paw has 5 toes, but the back</text><text x="40" y="76" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">paws have 4. Some cats are born with as many</text><text x="40" y="102" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">as 7 front toes and extra back toes</text><text x="40" y="128" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">(polydactl).</text>
</svg>