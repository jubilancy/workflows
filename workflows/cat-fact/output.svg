<svg xmlns="http://www.w3.org/2000/svg" width="560" height="236">
<rect width="100%" height="100%" fill="#eef3ff" stroke="#c9d6f7" stroke-width="2"/>
<text x="40" y="34" font-family="monospace" font-size="14" fill="#5b6fa8">🐱 Cat Fact of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">A cat has the power to sometimes heal</text><text x="40" y="76" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">themselves by purring. A domestic cat&#x27;s purr</text><text x="40" y="102" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">has a frequency of between 25 and 150 Hertz,</text><text x="40" y="128" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">which happens to be the frequency at which</text><text x="40" y="154" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">muscles and bones best grow and repair</text><text x="40" y="180" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">themselves.</text>
</svg>