<svg xmlns="http://www.w3.org/2000/svg" width="560" height="184">
<rect width="100%" height="100%" fill="#eef3ff" stroke="#c9d6f7" stroke-width="2"/>
<text x="40" y="34" font-family="monospace" font-size="14" fill="#5b6fa8">🐱 Cat Fact of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">The domestic cat is the only species able to</text><text x="40" y="76" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">hold its tail vertically while walking. You</text><text x="40" y="102" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">can also learn about your cat&#x27;s present state</text><text x="40" y="128" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">of mind by observing the posture of his tail.</text>
</svg>