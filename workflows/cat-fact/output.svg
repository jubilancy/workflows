<svg xmlns="http://www.w3.org/2000/svg" width="560" height="236">
<rect width="100%" height="100%" fill="#eef3ff" stroke="#c9d6f7" stroke-width="2"/>
<text x="40" y="34" font-family="monospace" font-size="14" fill="#5b6fa8">🐱 Cat Fact of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">Some cats have survived falls of over 65 feet</text><text x="40" y="76" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">(20 meters), due largely to their “righting</text><text x="40" y="102" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">reflex.” The eyes and balance organs in the</text><text x="40" y="128" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">inner ear tell it where it is in space so the</text><text x="40" y="154" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">cat can land on its feet. Even cats without a</text><text x="40" y="180" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">tail have this ability.</text>
</svg>