<svg xmlns="http://www.w3.org/2000/svg" width="560" height="158">
<rect width="100%" height="100%" fill="#eef3ff" stroke="#c9d6f7" stroke-width="2"/>
<text x="40" y="34" font-family="monospace" font-size="14" fill="#5b6fa8">🐱 Cat Fact of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">A cat’s back is extremely flexible because it</text><text x="40" y="76" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">has up to 53 loosely fitting vertebrae. Humans</text><text x="40" y="102" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">only have 34.</text>
</svg>