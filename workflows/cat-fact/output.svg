<text x="40" y="50" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">Cats have 30 vertebrae (humans have 33</text><text x="40" y="76" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">vertebrae during early development; 26 after</text><text x="40" y="102" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">the sacral and coccygeal regions fuse)</text>
