<text x="40" y="34" font-family="monospace" font-size="14" fill="#5b6fa8">🐱 Cat Fact of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">In Japan, cats are thought to have the power</text><text x="40" y="76" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">to turn into super spirits when they die. This</text><text x="40" y="102" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">may be because according to the Buddhist</text><text x="40" y="128" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">religion, the body of the cat is the temporary</text><text x="40" y="154" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">resting place of very spiritual people.i</text>
</svg>