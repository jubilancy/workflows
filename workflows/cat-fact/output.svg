<svg xmlns="http://www.w3.org/2000/svg" width="560" height="184">
<rect width="100%" height="100%" fill="#eef3ff" stroke="#c9d6f7" stroke-width="2"/>
<text x="40" y="34" font-family="monospace" font-size="14" fill="#5b6fa8">🐱 Cat Fact of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">The cat who holds the record for the longest</text><text x="40" y="76" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">non-fatal fall is Andy. He fell from the 16th</text><text x="40" y="102" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">floor of an apartment building (about 200</text><text x="40" y="128" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">ft/.06 km) and survived.</text>
</svg>