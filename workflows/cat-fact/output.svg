<svg xmlns="http://www.w3.org/2000/svg" width="560" height="288">
<rect width="100%" height="100%" fill="#eef3ff" stroke="#c9d6f7" stroke-width="2"/>
<text x="40" y="34" font-family="monospace" font-size="14" fill="#5b6fa8">🐱 Cat Fact of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">Two members of the cat family are distinct</text><text x="40" y="76" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">from all others: the clouded leopard and the</text><text x="40" y="102" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">cheetah. The clouded leopard does not roar</text><text x="40" y="128" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">like other big cats, nor does it groom or rest</text><text x="40" y="154" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">like small cats. The cheetah is unique because</text><text x="40" y="180" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">it is a running cat; all others are leaping</text><text x="40" y="206" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">cats. They are leaping cats because they</text><text x="40" y="232" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">slowly stalk their prey and then leap on it.</text>
</svg>