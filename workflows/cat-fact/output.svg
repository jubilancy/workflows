<text x="40" y="34" font-family="monospace" font-size="14" fill="#5b6fa8">🐱 Cat Fact of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">A cat’s hearing is better than a dog’s. And a</text><text x="40" y="76" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">cat can hear high-frequency sounds up to two</text><text x="40" y="102" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">octaves higher than a human.</text>
</svg>