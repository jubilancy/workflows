<text x="40" y="34" font-family="monospace" font-size="14" fill="#5b6fa8">🐱 Cat Fact of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">All cats have three sets of long hairs that</text><text x="40" y="76" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">are sensitive to pressure - whiskers,</text><text x="40" y="102" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">eyebrows,and the hairs between their paw pads.</text>
