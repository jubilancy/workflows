<svg xmlns="http://www.w3.org/2000/svg" width="560" height="236">
<rect width="100%" height="100%" fill="#eef3ff" stroke="#c9d6f7" stroke-width="2"/>
<text x="40" y="34" font-family="monospace" font-size="14" fill="#5b6fa8">🐱 Cat Fact of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">During the time of the Spanish Inquisition,</text><text x="40" y="76" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">Pope Innocent VIII condemned cats as evil and</text><text x="40" y="102" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">thousands of cats were burned. Unfortunately,</text><text x="40" y="128" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">the widespread killing of cats led to an</text><text x="40" y="154" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">explosion of the rat population, which</text><text x="40" y="180" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">exacerbated the effects of the Black Death.</text>
</svg>