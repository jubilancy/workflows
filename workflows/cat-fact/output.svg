<svg xmlns="http://www.w3.org/2000/svg" width="560" height="210">
<rect width="100%" height="100%" fill="#eef3ff" stroke="#c9d6f7" stroke-width="2"/>
<text x="40" y="34" font-family="monospace" font-size="14" fill="#5b6fa8">🐱 Cat Fact of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">Cats prefer to remain non-confrontational.</text><text x="40" y="76" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">They will not fight to show dominance, but</text><text x="40" y="102" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">rather to stake their territory. Cats will</text><text x="40" y="128" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">actually go to extremes to avoid one another</text><text x="40" y="154" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">in order to prevent a possible confrontation.</text>
</svg>