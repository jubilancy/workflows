<svg xmlns="http://www.w3.org/2000/svg" width="560" height="236">
<rect width="100%" height="100%" fill="#eef3ff" stroke="#c9d6f7" stroke-width="2"/>
<text x="40" y="34" font-family="monospace" font-size="14" fill="#5b6fa8">🐱 Cat Fact of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">Like birds, cats have a homing ability that</text><text x="40" y="76" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">uses its biological clock, the angle of the</text><text x="40" y="102" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">sun, and the Earth&#x27;s magnetic field. A cat</text><text x="40" y="128" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">taken far from its home can return to it. But</text><text x="40" y="154" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">if a cat&#x27;s owners move far from its home, the</text><text x="40" y="180" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">cat can&#x27;t find them.</text>
</svg>