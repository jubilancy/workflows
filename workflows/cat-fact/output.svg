<svg xmlns="http://www.w3.org/2000/svg" width="560" height="184">
<rect width="100%" height="100%" fill="#eef3ff" stroke="#c9d6f7" stroke-width="2"/>
<text x="40" y="34" font-family="monospace" font-size="14" fill="#5b6fa8">🐱 Cat Fact of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">The silks created by weavers in Baghdad were</text><text x="40" y="76" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">inspired by the beautiful and varied colors</text><text x="40" y="102" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">and markings of cat coats. These fabrics were</text><text x="40" y="128" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">called &#x27;tabby&#x27; by European traders.</text>
</svg>