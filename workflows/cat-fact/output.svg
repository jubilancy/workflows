<svg xmlns="http://www.w3.org/2000/svg" width="560" height="288">
<rect width="100%" height="100%" fill="#eef3ff" stroke="#c9d6f7" stroke-width="2"/>
<text x="40" y="34" font-family="monospace" font-size="14" fill="#5b6fa8">🐱 Cat Fact of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">The world’s rarest coffee, Kopi Luwak, comes</text><text x="40" y="76" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">from Indonesia where a wildcat known as the</text><text x="40" y="102" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">luwak lives. The cat eats coffee berries and</text><text x="40" y="128" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">the coffee beans inside pass through the</text><text x="40" y="154" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">stomach. The beans are harvested from the</text><text x="40" y="180" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">cat’s dung heaps and then cleaned and roasted.</text><text x="40" y="206" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">Kopi Luwak sells for about $500 for a 450 g (1</text><text x="40" y="232" font-family="Georgia, serif" font-size="19" fill="#2e2e3a">lb) bag.</text>
</svg>