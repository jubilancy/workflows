<text x="40" y="34" font-family="monospace" font-size="14" fill="#b08a3e">Dad Joke of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">I really want to buy one of those supermarket</text><text x="40" y="76" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">checkout dividers, but the cashier keeps putting</text><text x="40" y="102" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">it back.</text>
</svg>