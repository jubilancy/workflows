<svg xmlns="http://www.w3.org/2000/svg" width="560" height="210">
<rect width="100%" height="100%" fill="#fff8e7" stroke="#e8d9b5" stroke-width="2"/>
<text x="40" y="34" font-family="monospace" font-size="14" fill="#b08a3e">Dad Joke of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">Two muffins were sitting in an oven, and the</text><text x="40" y="76" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">first looks over to the second, and says, “man,</text><text x="40" y="102" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">it’s really hot in here”. The second looks over</text><text x="40" y="128" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">at the first with a surprised look, and answers,</text><text x="40" y="154" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">“WHOA, a talking muffin!”</text>
</svg>