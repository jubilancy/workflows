<svg xmlns="http://www.w3.org/2000/svg" width="560" height="158">
<rect width="100%" height="100%" fill="#fff8e7" stroke="#e8d9b5" stroke-width="2"/>
<text x="40" y="34" font-family="monospace" font-size="14" fill="#b08a3e">Dad Joke of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">What did the judge say to the dentist? Do you</text><text x="40" y="76" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">swear to pull the tooth, the whole tooth and</text><text x="40" y="102" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">nothing but the tooth?</text>
</svg>