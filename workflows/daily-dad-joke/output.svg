<text x="40" y="50" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">What is the difference between ignorance and</text><text x="40" y="76" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">apathy?  I don&#x27;t know and I don&#x27;t care.</text>
