<text x="40" y="34" font-family="monospace" font-size="14" fill="#b08a3e">Dad Joke of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">Why does a chicken coop only have two doors?</text><text x="40" y="76" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">Because if it had four doors it would be a</text><text x="40" y="102" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">chicken sedan.</text>
</svg>