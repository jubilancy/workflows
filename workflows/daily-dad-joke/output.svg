<text x="40" y="50" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">I thought my wife was joking when she said she&#x27;d</text><text x="40" y="76" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">leave me if I didn&#x27;t stop signing &quot;I&#x27;m A</text><text x="40" y="102" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">Believer&quot;... Then I saw her face.</text>
