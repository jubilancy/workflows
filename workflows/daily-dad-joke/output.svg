<svg xmlns="http://www.w3.org/2000/svg" width="560" height="158">
<rect width="100%" height="100%" fill="#fff8e7" stroke="#e8d9b5" stroke-width="2"/>
<text x="40" y="34" font-family="monospace" font-size="14" fill="#b08a3e">Dad Joke of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">A police officer caught two kids playing with a</text><text x="40" y="76" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">firework and a car battery. He charged one and</text><text x="40" y="102" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">let the other one off.</text>
</svg>