<svg xmlns="http://www.w3.org/2000/svg" width="560" height="158">
<rect width="100%" height="100%" fill="#fff8e7" stroke="#e8d9b5" stroke-width="2"/>
<text x="40" y="34" font-family="monospace" font-size="14" fill="#b08a3e">Dad Joke of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">When people are sad, I sometimes let them colour</text><text x="40" y="76" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">in my tattoos. Sometimes all they need is a</text><text x="40" y="102" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">shoulder to crayon.</text>
</svg>