<text x="40" y="34" font-family="monospace" font-size="14" fill="#b08a3e">Dad Joke of the Day</text>
<text x="40" y="50" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">Did you hear about the new restaurant on the</text><text x="40" y="76" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">moon? The food is great, but there’s just no</text><text x="40" y="102" font-family="Georgia, serif" font-size="20" fill="#3a2e2e">atmosphere.</text>
